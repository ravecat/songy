services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      # Phoenix configuration
      PHX_SERVER: "true"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PORT: "${PORT:-4000}"
      PHX_URL_SCHEME: "${PHX_URL_SCHEME:-http}"
      PHX_URL_PORT: "${PHX_URL_PORT:-4000}"
      
      # Security
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      
      # Spotify configuration
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID}"
      SPOTIFY_SECRET_KEY: "${SPOTIFY_SECRET_KEY}"
      
      # Environment
      MIX_ENV: "prod"
      
      # Release path for env files
      RELEASE_ROOT: "/app"
    volumes:
      # Mount env files if needed
      - ./envs:/app/envs:ro
    networks:
      - songy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  songy-network:
    driver: bridge
