asyncapi: 3.0.0
info:
  title: Songy Async API
  version: 1.0.0
  description: >
    Real-time async API over Phoenix Channels for a multiplayer music-guessing game.

    All communication goes through a single Phoenix Channel per game room
    (`room:{room_id}`). The client authenticates the WebSocket connection
    with a short-lived `user_token` issued server-side on page load.
  license:
    name: MIT
servers:
  production:
    host: "{domain}"
    pathname: "/socket/websocket"
    protocol: wss
    description: Phoenix WebSocket endpoint (production)
    variables:
      domain:
        description: Server hostname. Set via PHX_HOST env var.
    bindings:
      ws:
        method: GET
        query:
          $ref: "#/components/schemas/socketConnectQuery"
        bindingVersion: 0.1.0
  development:
    host: "{domain}:{port}"
    pathname: "/socket/websocket"
    protocol: ws
    description: Local development server
    variables:
      domain:
        default: localhost
      port:
        default: "5000"
        description: >
          Phoenix dev server port. Configured via PORT env var in config/dev.exs.
    bindings:
      ws:
        method: GET
        query:
          $ref: "#/components/schemas/socketConnectQuery"
        bindingVersion: 0.1.0
defaultContentType: application/json
channels:
  gameRoom:
    address: "room:{room_id}"
    title: Game Room
    description: >
      Phoenix Channel for a single game room. One room per active game session.
      The room is created via the HTTP `/create` endpoint; clients join by
      navigating to `/{room_id}` and connecting to this channel.

      The server pushes `state` on join and after every game transition.
      The server pushes `timer` events during the challenging phase.
    parameters:
      room_id:
        description: >
          Unique room identifier. Short, human-readable string generated by
          `unique_names_generator`. Example: `happy-tiger-42`.
    messages:
      phxJoin:
        $ref: "#/components/messages/phxJoin"
      phxJoinReply:
        $ref: "#/components/messages/phxJoinReply"
      phxError:
        $ref: "#/components/messages/phxError"
      phxClose:
        $ref: "#/components/messages/phxClose"
      stateOut:
        $ref: "#/components/messages/stateOut"
      timerOut:
        $ref: "#/components/messages/timerOut"
      startGame:
        $ref: "#/components/messages/startGame"
      startPlayback:
        $ref: "#/components/messages/startPlayback"
      pausePlayback:
        $ref: "#/components/messages/pausePlayback"
      advanceTurn:
        $ref: "#/components/messages/advanceTurn"
      makeAssumption:
        $ref: "#/components/messages/makeAssumption"
      getProvider:
        $ref: "#/components/messages/getProvider"
      updateProvider:
        $ref: "#/components/messages/updateProvider"
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
operations:
  joinRoom:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Join a game room
    description: |
      Client joins a game room by sending `phx_join`. The server looks up the
      GameSession process via the Registry and subscribes to presence tracking.
      Immediately after joining, the server pushes a `state` event with the
      current game state and the caller's permission set.
    messages:
      - $ref: "#/channels/gameRoom/messages/phxJoin"
    reply:
      channel:
        $ref: "#/channels/gameRoom"
      messages:
        - $ref: "#/channels/gameRoom/messages/phxJoinReply"
  startGame:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Start the game session
    description: |
      Transitions the game FSM from `:lobby` to `:playing`. Only the host
      (room creator) is authorized. All connected clients receive a `state`
      push after the transition.
    messages:
      - $ref: "#/channels/gameRoom/messages/startGame"
  startPlayback:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Start music playback
    description: |
      Instructs the Spotify provider to begin playback for the current turn.
      Only the host can trigger this. Returns `ok` on success.
    messages:
      - $ref: "#/channels/gameRoom/messages/startPlayback"
  pausePlayback:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Pause music playback
    description: |
      Pauses Spotify playback. Only the host can trigger this. Returns `ok`
      on success.
    messages:
      - $ref: "#/channels/gameRoom/messages/pausePlayback"
  advanceTurn:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Advance to the next turn
    description: |
      Moves the game to the next turn or phase. Only the host is authorized.
      All clients receive a `state` push after the transition.
    messages:
      - $ref: "#/channels/gameRoom/messages/advanceTurn"
  makeAssumption:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Submit a track position guess
    description: |
      Submits the player's guess for the current track's position in the
      playlist (0-based integer index). Each player can submit once per turn.
      Returns `ok` on success.
    messages:
      - $ref: "#/channels/gameRoom/messages/makeAssumption"
  getProvider:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Retrieve the caller's provider token
    description: |
      Returns the caller's current Spotify `access_token` from the ETS
      provider store. Used by the frontend to initialize the Spotify Web
      Playback SDK. Returns an error if the token is missing or invalid.
    messages:
      - $ref: "#/channels/gameRoom/messages/getProvider"
  updateProvider:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Update provider credentials
    description: |
      Patches the caller's provider record in ETS with the supplied fields
      (e.g. refreshed `access_token` or `device_id`). Used by the frontend
      after a token refresh. Returns `ok` on success.
    messages:
      - $ref: "#/channels/gameRoom/messages/updateProvider"
  receiveState:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive full game state
    description: |
      Server pushes the complete game state and the caller's permissions after
      every state transition. Also sent immediately after join (`init_client_state`).
    messages:
      - $ref: "#/channels/gameRoom/messages/stateOut"
  receiveTimer:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive countdown timer tick
    description: |
      Server broadcasts the remaining time (in milliseconds) during timed phases
      (e.g. the challenging / guessing phase). The interval is driven by the
      game FSM internal timer.
    messages:
      - $ref: "#/channels/gameRoom/messages/timerOut"
  receiveError:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive channel error event
    description: |
      Phoenix protocol-level channel failure event. Can occur on transport
      disruption or internal channel crash.
    messages:
      - $ref: "#/channels/gameRoom/messages/phxError"
  receiveClose:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive channel close event
    description: |
      Phoenix protocol-level close event signaling channel shutdown or
      explicit leave.
    messages:
      - $ref: "#/channels/gameRoom/messages/phxClose"
components:
  serverVariables:
    domain:
      description: Server hostname. Set via PHX_HOST env var.
    port:
      default: "5000"
      description: Server port. Set via PORT env var.
  messages:
    phxJoin:
      name: phx_join
      title: Join Room
      summary: Request to join a game room
      description: |
        Phoenix Channel join event. The server looks up the GameSession via
        `Registry` and subscribes to presence. On success the server sends
        back a `phx_reply` followed immediately by a `state` push.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/joinPayload"
      examples:
        - name: join-empty
          summary: Typical join with no extra payload
          payload: {}
    phxJoinReply:
      name: phx_reply
      title: Join Reply
      summary: Server confirms or rejects the join
      contentType: application/json
      payload:
        $ref: "#/components/schemas/joinReply"
      examples:
        - name: join-ok
          summary: Successful join
          payload:
            status: ok
            response: {}
        - name: join-error
          summary: Game not found
          payload:
            status: error
            response:
              reason: game_not_found
    phxError:
      name: phx_error
      title: Channel Error
      summary: Channel-level error event from Phoenix protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/phxSystemPayload"
      examples:
        - name: channel-error
          payload:
            reason: internal_error
    phxClose:
      name: phx_close
      title: Channel Closed
      summary: Channel close event from Phoenix protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/phxSystemPayload"
      examples:
        - name: channel-close
          payload:
            reason: closed
    stateOut:
      name: state
      title: Game State
      summary: Full game state push from server
      description: |
        Pushed after every FSM state transition and once on join.
        Contains the full `game` struct and the caller's `permissions` map.
        The `game` object is serialized by `Jason` from `Songy.Core.Game`.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/statePayload"
      examples:
        - name: state-lobby
          summary: Game waiting in lobby
          payload:
            game:
              id: happy-tiger-42
              state: lobby
              host_id: user_abc123
              players: []
              turn: null
              tracks: []
            permissions:
              can_start_game: true
              can_start_playback: false
              can_advance_turn: false
    timerOut:
      name: timer
      title: Timer Tick
      summary: Countdown timer tick during timed phase
      contentType: application/json
      payload:
        $ref: "#/components/schemas/timerPayload"
      examples:
        - name: timer-5s-remaining
          payload:
            remaining: 5000
    startGame:
      name: start_game
      title: Start Game
      summary: Host initiates the game session
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
      examples:
        - name: start-game
          payload: {}
    startPlayback:
      name: start_playback
      title: Start Playback
      summary: Host starts music playback for the current turn
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
      examples:
        - name: start-playback
          payload: {}
    pausePlayback:
      name: pause_playback
      title: Pause Playback
      summary: Host pauses music playback
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
      examples:
        - name: pause-playback
          payload: {}
    advanceTurn:
      name: advance_turn
      title: Advance Turn
      summary: Host advances to the next turn
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
      examples:
        - name: advance-turn
          payload: {}
    makeAssumption:
      name: make_assumption
      title: Make Assumption
      summary: Player submits a track position guess
      contentType: application/json
      payload:
        $ref: "#/components/schemas/assumptionPayload"
      examples:
        - name: guess-position-2
          summary: Player guesses position 2 (0-based)
          payload:
            position: 2
    getProvider:
      name: get_provider
      title: Get Provider
      summary: Retrieve the caller's Spotify access token
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
      examples:
        - name: get-provider
          payload: {}
    updateProvider:
      name: update_provider
      title: Update Provider
      summary: Patch the caller's provider credentials in ETS
      contentType: application/json
      payload:
        $ref: "#/components/schemas/updateProviderPayload"
      examples:
        - name: update-token
          summary: Refresh the Spotify access token
          payload:
            access_token: BQD...refreshed
            device_id: abc-device-123
  schemas:
    socketConnectQuery:
      type: object
      description: Query parameters for WebSocket connect
      properties:
        vsn:
          type: string
          description: Phoenix serializer version
          const: "2.0.0"
        user_token:
          type: string
          description: >
            Short-lived token signed with `Phoenix.Token` on page load.
            Used by `UserSocket.connect/3` to authenticate the connection.
            Max age is 24 hours.
      required:
        - vsn
        - user_token
      additionalProperties: false
    joinPayload:
      type: object
      description: Optional join payload accepted by the channel join handler
      additionalProperties: true
    joinReply:
      oneOf:
        - type: object
          properties:
            status:
              const: ok
            response:
              type: object
              additionalProperties: true
          required:
            - status
            - response
        - type: object
          properties:
            status:
              const: error
            response:
              type: object
              properties:
                reason:
                  type: string
                  description: Error reason (e.g. "game_not_found")
              required:
                - reason
          required:
            - status
            - response
    phxSystemPayload:
      type: object
      description: Phoenix protocol payload for channel lifecycle events
      additionalProperties: true
    statePayload:
      type: object
      description: Full game state and caller's permissions
      required:
        - game
        - permissions
      properties:
        game:
          $ref: "#/components/schemas/game"
        permissions:
          $ref: "#/components/schemas/permissions"
    timerPayload:
      type: object
      description: Countdown timer tick
      required:
        - remaining
      properties:
        remaining:
          type: integer
          description: Remaining time in milliseconds
          example: 5000
    game:
      type: object
      description: |
        Game struct serialized from `Songy.Core.Game`. All fields are
        Jason-encoded. The `state` field is the GenStatem FSM state name.
      properties:
        id:
          type: string
          description: Room ID (unique_names_generator slug)
        state:
          type: string
          description: Current FSM state
          enum:
            - lobby
            - playing
            - turn
            - challenging
            - scoring
            - finished
        host_id:
          type: string
          description: User ID of the room creator
        players:
          type: array
          items:
            $ref: "#/components/schemas/player"
        turn:
          oneOf:
            - $ref: "#/components/schemas/turn"
            - type: "null"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/track"
      additionalProperties: true
    player:
      type: object
      description: Player state within the game
      properties:
        id:
          type: string
        name:
          type: string
        score:
          type: integer
      additionalProperties: true
    turn:
      type: object
      description: Current turn state
      properties:
        track:
          $ref: "#/components/schemas/track"
        assumptions:
          type: object
          description: Map of user_id to guessed position
          additionalProperties:
            type: integer
      additionalProperties: true
    track:
      type: object
      description: Music track data
      properties:
        id:
          type: string
        name:
          type: string
        artist:
          type: string
        uri:
          type: string
          description: Provider URI (e.g. Spotify track URI)
      additionalProperties: true
    permissions:
      type: object
      description: |
        Caller-specific permission flags computed by `Songy.Authorization`.
        All boolean fields; missing key means `false`.
      properties:
        can_start_game:
          type: boolean
        can_start_playback:
          type: boolean
        can_pause_playback:
          type: boolean
        can_advance_turn:
          type: boolean
        can_make_assumption:
          type: boolean
      additionalProperties: true
    emptyPayload:
      type: object
      description: No payload fields required
      additionalProperties: true
    assumptionPayload:
      type: object
      required:
        - position
      properties:
        position:
          type: integer
          description: >
            0-based index of the guessed track position in the ordered
            playlist. Must be a non-negative integer.
          minimum: 0
    updateProviderPayload:
      type: object
      description: >
        Partial update for the caller's provider record in ETS.
        All known Spotify provider fields are accepted.
      properties:
        access_token:
          type: string
          description: Refreshed Spotify OAuth access token
        refresh_token:
          type: string
          description: Spotify OAuth refresh token
        device_id:
          type: string
          description: Spotify Connect device ID for playback
        expires_at:
          type: integer
          description: Token expiry as Unix timestamp (seconds)
      additionalProperties: true
  securitySchemes:
    socketToken:
      type: httpApiKey
      name: user_token
      in: query
      description: |
        Phoenix.Token signed with the endpoint secret. Passed as `user_token`
        query parameter during WebSocket connect. Verified in
        `SongyWeb.UserSocket.connect/3` with max_age of 86400 seconds.
