asyncapi: 3.0.0
info:
  title: Game Room Async API
  version: 1.1.0
  description: >
    Real-time async API for multiplayer game rooms.

    This document defines the room-scoped messaging contract between clients and
    the backend, including room actions, authoritative room snapshots, and
    protocol replies.
  license:
    name: MIT
  tags:
    - name: room
      description: Multiplayer game room messaging
servers:
  production:
    host: "{domain}"
    pathname: /socket/websocket
    protocol: wss
    description: Phoenix WebSocket endpoint in production
    variables:
      domain:
        $ref: "#/components/serverVariables/domain"
    bindings:
      ws:
        method: GET
        query:
          $ref: "#/components/schemas/socketConnectQuery"
        bindingVersion: 0.1.0
  development:
    host: "{domain}:{port}"
    pathname: /socket/websocket
    protocol: ws
    description: Local development Phoenix WebSocket endpoint
    variables:
      domain:
        default: localhost
      port:
        $ref: "#/components/serverVariables/port"
    bindings:
      ws:
        method: GET
        query:
          $ref: "#/components/schemas/socketConnectQuery"
        bindingVersion: 0.1.0
defaultContentType: application/json
channels:
  gameRoom:
    address: "room:{room_id}"
    title: Game Room
    description: >
      Phoenix Channel for a single game room.

      The channel is stateful: the server returns the initial room snapshot in
      the join reply and pushes `snapshot` after subsequent state transitions.
      Challenging-phase timer data is embedded in `game.turn.deadline_at_ms`.
    parameters:
      room_id:
        description:
          Human-readable room identifier, for example `happy-tiger-42`
    messages:
      joinRoomRequest:
        $ref: "#/components/messages/joinRoomRequest"
      joinRoomReply:
        $ref: "#/components/messages/joinRoomReply"
      channelError:
        $ref: "#/components/messages/channelError"
      channelClosed:
        $ref: "#/components/messages/channelClosed"
      snapshot:
        $ref: "#/components/messages/snapshot"
      startGame:
        $ref: "#/components/messages/startGame"
      startPlayback:
        $ref: "#/components/messages/startPlayback"
      startPlaybackReplyOk:
        $ref: "#/components/messages/startPlaybackReplyOk"
      pausePlayback:
        $ref: "#/components/messages/pausePlayback"
      pausePlaybackReplyOk:
        $ref: "#/components/messages/pausePlaybackReplyOk"
      advanceTurn:
        $ref: "#/components/messages/advanceTurn"
      advanceTurnReplyOk:
        $ref: "#/components/messages/advanceTurnReplyOk"
      makeAssumption:
        $ref: "#/components/messages/makeAssumption"
      makeAssumptionReplyOk:
        $ref: "#/components/messages/makeAssumptionReplyOk"
      makeAssumptionReplyUnknownEvent:
        $ref: "#/components/messages/makeAssumptionReplyUnknownEvent"
      unknownEventReply:
        $ref: "#/components/messages/unknownEventReply"
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
operations:
  joinRoom:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Join a game room
    description: |
      Client sends `phx_join` for the room topic.
      On success the server confirms the join with the initial room snapshot.
      On failure the join is rejected with `game_not_found`.
    messages:
      - $ref: "#/channels/gameRoom/messages/joinRoomRequest"
    reply:
      channel:
        $ref: "#/channels/gameRoom"
      messages:
        - $ref: "#/channels/gameRoom/messages/joinRoomReply"
  startGame:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Start the game
    description: |
      Client sends `start_game` with an empty payload.
      The channel intentionally does not reply to this event.
      Success is observed via a subsequent `snapshot` push.
      Failures are logged server-side and also produce no reply.
    messages:
      - $ref: "#/channels/gameRoom/messages/startGame"
  startPlayback:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Start playback
    description: |
      Client sends `start_playback` to start the current track.
      Success returns `phx_reply` with empty `response`.
      Failures are logged server-side and produce no reply.
    messages:
      - $ref: "#/channels/gameRoom/messages/startPlayback"
    reply:
      channel:
        $ref: "#/channels/gameRoom"
      messages:
        - $ref: "#/channels/gameRoom/messages/startPlaybackReplyOk"
  pausePlayback:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Pause playback
    description: |
      Client sends `pause_playback` to pause the current track.
      Success returns `phx_reply` with empty `response`.
      Failures are logged server-side and produce no reply.
    messages:
      - $ref: "#/channels/gameRoom/messages/pausePlayback"
    reply:
      channel:
        $ref: "#/channels/gameRoom"
      messages:
        - $ref: "#/channels/gameRoom/messages/pausePlaybackReplyOk"
  advanceTurn:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Advance the room to the next phase
    description: |
      Client sends `advance_turn` to move the game forward.
      Success returns `phx_reply` with empty `response`.
      The resulting game snapshot is delivered separately via `snapshot`.
      Failures are logged server-side and produce no reply.
    messages:
      - $ref: "#/channels/gameRoom/messages/advanceTurn"
    reply:
      channel:
        $ref: "#/channels/gameRoom"
      messages:
        - $ref: "#/channels/gameRoom/messages/advanceTurnReplyOk"
  makeAssumption:
    action: send
    channel:
      $ref: "#/channels/gameRoom"
    summary: Submit a position guess for the active track
    description: |
      Client sends `make_assumption` with a zero-based `position`.
      Success returns `phx_reply` with empty `response`.
      Domain failures or invalid integer parsing produce no reply.
      If the payload shape does not match the expected contract at all
      (for example missing `position`), the channel falls through to the generic
      handler and replies with `unknown_event`.
    messages:
      - $ref: "#/channels/gameRoom/messages/makeAssumption"
    reply:
      channel:
        $ref: "#/channels/gameRoom"
      messages:
        - $ref: "#/channels/gameRoom/messages/makeAssumptionReplyOk"
        - $ref: "#/channels/gameRoom/messages/makeAssumptionReplyUnknownEvent"
  receiveSnapshot:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive the latest room snapshot
    description: |
      Server pushes `snapshot`:
      - immediately after a successful join
      - after any game transition or state change

      The payload includes the full `game` snapshot and the caller-specific
      permission flags.
    messages:
      - $ref: "#/channels/gameRoom/messages/snapshot"
  receiveError:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive a Phoenix channel error event
    description: |
      Phoenix protocol-level error event emitted when the channel crashes
      or the transport fails.
    messages:
      - $ref: "#/channels/gameRoom/messages/channelError"
  receiveClose:
    action: receive
    channel:
      $ref: "#/channels/gameRoom"
    summary: Receive a Phoenix channel close event
    description: |
      Phoenix protocol-level close event emitted on channel shutdown or leave.
    messages:
      - $ref: "#/channels/gameRoom/messages/channelClosed"
components:
  serverVariables:
    domain:
      description: Server hostname. Set via `PHX_HOST`
    port:
      default: "5000"
      description: Server port. Set via `PORT`
  messages:
    joinRoomRequest:
      name: phx_join
      title: Join Room
      summary: Join request for a room topic
      tags:
        - name: phoenix
      contentType: application/json
      payload:
        $ref: "#/components/schemas/joinPayload"
    joinRoomReply:
      name: phx_reply
      title: Join Reply
      summary: Join success or failure
      tags:
        - name: phoenix
      contentType: application/json
      payload:
        $ref: "#/components/schemas/joinReply"
    channelError:
      name: phx_error
      title: Channel Error
      summary: Phoenix channel error event
      tags:
        - name: phoenix
      contentType: application/json
      payload:
        $ref: "#/components/schemas/phxSystemPayload"
    channelClosed:
      name: phx_close
      title: Channel Closed
      summary: Phoenix channel close event
      tags:
        - name: phoenix
      contentType: application/json
      payload:
        $ref: "#/components/schemas/phxSystemPayload"
    snapshot:
      name: snapshot
      title: Snapshot Push
      summary: Full room snapshot and caller permissions
      contentType: application/json
      payload:
        $ref: "#/components/schemas/snapshotPayload"
    startGame:
      name: start_game
      title: Start Game
      summary: Request to start the room
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
    startPlayback:
      name: start_playback
      title: Start Playback
      summary: Request to start playback
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
    startPlaybackReplyOk:
      name: phx_reply
      title: Start Playback Reply
      summary: Successful playback start reply
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyReply"
    pausePlayback:
      name: pause_playback
      title: Pause Playback
      summary: Request to pause playback
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
    pausePlaybackReplyOk:
      name: phx_reply
      title: Pause Playback Reply
      summary: Successful playback pause reply
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyReply"
    advanceTurn:
      name: advance_turn
      title: Advance Turn
      summary: Request to advance the room state
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
    advanceTurnReplyOk:
      name: phx_reply
      title: Advance Turn Reply
      summary: Successful turn advance reply
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyReply"
    makeAssumption:
      name: make_assumption
      title: Make Assumption
      summary: Submit a guessed position
      contentType: application/json
      payload:
        $ref: "#/components/schemas/assumptionPayload"
    makeAssumptionReplyOk:
      name: phx_reply
      title: Make Assumption Reply
      summary: Successful assumption reply
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyReply"
    makeAssumptionReplyUnknownEvent:
      name: phx_reply
      title: Make Assumption Unknown Event Reply
      summary: Error reply when the payload shape misses required fields
      contentType: application/json
      payload:
        $ref: "#/components/schemas/unknownEventReply"
    unknownEventReply:
      name: phx_reply
      title: Unknown Event Reply
      summary: Generic error reply for unknown client events
      contentType: application/json
      payload:
        $ref: "#/components/schemas/unknownEventReply"
  schemas:
    socketConnectQuery:
      type: object
      description:
        Query parameters used by the Phoenix JS client during socket connect
      properties:
        vsn:
          type: string
          const: "2.0.0"
          description: Phoenix serializer version added by the Phoenix client
        user_token:
          type: string
          description: >
            Signed user token issued on page render and accepted during socket
            authentication with a maximum age of 86400 seconds
      required:
        - vsn
        - user_token
      additionalProperties: false
    joinPayload:
      type: object
      description: Join payload accepted by the room channel
      additionalProperties: true
    joinReply:
      oneOf:
        - type: object
          required:
            - status
            - response
          properties:
            status:
              const: ok
            response:
              $ref: "#/components/schemas/snapshotPayload"
          additionalProperties: false
        - type: object
          required:
            - status
            - response
          properties:
            status:
              const: error
            response:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - game_not_found
              additionalProperties: false
          additionalProperties: false
    phxSystemPayload:
      type: object
      description: Phoenix protocol payload for lifecycle events
      additionalProperties: true
    snapshotPayload:
      type: object
      description: Authoritative room snapshot sent to the client
      required:
        - game
        - permissions
      properties:
        game:
          $ref: "#/components/schemas/game"
        permissions:
          $ref: "#/components/schemas/permissions"
      additionalProperties: false
    game:
      type: object
      description: JSON-encoded game snapshot
      required:
        - id
        - owner_id
        - max_participants
        - max_score
        - status
        - participants
        - scores
        - player
        - timelines
        - created_at
        - queue
        - cursor
        - track
        - turn
      properties:
        id:
          type: string
        owner_id:
          type: string
        max_participants:
          type: integer
          minimum: 1
        max_score:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - waiting
            - in_progress
            - finished
        participants:
          type: object
          description: Connected and known room participants keyed by user id
          additionalProperties:
            $ref: "#/components/schemas/user"
        scores:
          type: object
          description: Per-user scores keyed by user id
          additionalProperties:
            type: integer
        player:
          oneOf:
            - $ref: "#/components/schemas/player"
            - type: "null"
        timelines:
          type: object
          description: Per-user ordered timelines keyed by user id
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/track"
        created_at:
          type: string
          format: date-time
        queue:
          type: array
          items:
            type: string
        cursor:
          type: integer
          minimum: 0
        track:
          oneOf:
            - $ref: "#/components/schemas/track"
            - type: "null"
        turn:
          oneOf:
            - $ref: "#/components/schemas/turn"
            - type: "null"
      additionalProperties: false
    user:
      type: object
      description: JSON-encoded user
      required:
        - id
        - name
        - avatar_url
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        name:
          type: string
        avatar_url:
          type: string
          format: uri
      additionalProperties: false
    player:
      type: object
      description: JSON-encoded player
      required:
        - is_playback
      properties:
        is_playback:
          type: boolean
      additionalProperties: false
    turn:
      type: object
      description: JSON-encoded turn
      required:
        - phase
        - assumptions
        - winner_id
        - deadline_at_ms
      properties:
        phase:
          type: string
          enum:
            - waiting
            - ready
            - challenging
            - results
        assumptions:
          type: object
          description: >
            Map keyed by JSON stringified zero-based positions. Values are user
            ids.
          additionalProperties:
            type: string
        winner_id:
          oneOf:
            - type: string
            - type: "null"
        deadline_at_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
          description: >
            Authoritative challenging-phase deadline as Unix epoch time in
            milliseconds. Null outside time-bound phases.
      additionalProperties: false
    track:
      type: object
      description: JSON-encoded track
      required:
        - id
        - title
        - artist
        - year
        - cover_url
        - meta
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        year:
          type: integer
        cover_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
        meta:
          type: object
          properties:
            preview_url:
              type: string
              format: uri
            uri:
              type: string
          additionalProperties: true
      additionalProperties: false
    permissions:
      type: object
      description:
        Caller-specific permissions computed by the authorization layer
      required:
        - can_control_playback
        - can_advance_turn
        - can_start_game
        - can_start_turn
        - can_restart_game
        - can_see_assumptions
        - can_make_assumptions
      properties:
        can_control_playback:
          type: boolean
        can_advance_turn:
          type: boolean
        can_start_game:
          type: boolean
        can_start_turn:
          type: boolean
        can_restart_game:
          type: boolean
        can_see_assumptions:
          type: boolean
        can_make_assumptions:
          type: boolean
      additionalProperties: false
    emptyPayload:
      type: object
      description: Event without application payload fields
      additionalProperties: false
    assumptionPayload:
      type: object
      required:
        - position
      properties:
        position:
          type: integer
          minimum: 0
          description:
            Zero-based insertion position in the active player's timeline
      additionalProperties: false
    emptyReply:
      type: object
      required:
        - status
        - response
      properties:
        status:
          const: ok
        response:
          type: object
          additionalProperties: true
      additionalProperties: false
    unknownEventReply:
      type: object
      required:
        - status
        - response
      properties:
        status:
          const: error
        response:
          type: object
          required:
            - reason
            - event
          properties:
            reason:
              const: unknown_event
            event:
              type: string
          additionalProperties: false
      additionalProperties: false
  securitySchemes:
    socketToken:
      type: httpApiKey
      name: user_token
      in: query
      description: >
        Signed token passed as the `user_token` query parameter during socket
        connect.
