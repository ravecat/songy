app = "songy"
kill_signal = "SIGTERM"
primary_region = "fra"

[deploy]
release_command = "/app/bin/migrate"

[env]
PHX_HOST = "songy.fly.dev"
PHX_URL_SCHEME = "https"
PHX_URL_PORT = "443"

[http_service]
auto_start_machines = true
auto_stop_machines = "stop"
force_https = true
internal_port = 8080
min_machines_running = 0
processes = ["app"]

[http_service.concurrency]
hard_limit = 1_000
soft_limit = 1_000
type = "connections"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 1_024
