name: Storybook

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Install dependencies
        run: just setup
      - name: Check types and components
        run: |
          just assets typecheck
          just assets check
      - name: Test stories and unit logic
        id: vitest-tests
        run: just assets test --reporter=html
      - name: Build Storybook
        run: just assets storybook:build
      - name: Upload visual failure evidence
        if: failure() && steps.vitest-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-failure-evidence
          path: |
            assets/.vitest/report/
            assets/.vitest/attachments/
            assets/.vitest/screenshots/
            assets/.vitest/traces/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
